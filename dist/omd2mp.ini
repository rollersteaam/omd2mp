; omd2mp loader settings - copy next to OrcsMustDie2.exe together with version.dll
[omd2mp]
; 0 = load but patch nothing
enabled=1
; party size, 2..16. Every player in the session must use the same value.
players=4
; patch groups to apply (see patches/patchset.json):
;   lobby    Steam lobby size + host connection caps
;   mesh     client connection cap + FullyConnectedMesh2 auto-connect
;   slots    grow the Session player-slot array to `players`   (EXPERIMENTAL)
;   economy  NetMoneyFactor = 1/players (team gold stays equal to vanilla 2-player)
;   netfix   RakNet receive-drain fix for co-op disconnects (docs/DISCONNECT_FIX_PROPOSAL.md)
groups=lobby,mesh,slots,economy

[dev]
; Developer console: a local-only named pipe (\\.\pipe\<pipe>) for tools/devcon.py.
; Lets scripts read game state, call UI script functions, change game speed and run soak
; tests. Off by default; works even with [omd2mp] enabled=0. See docs/CONTRIBUTING.md section 12.
enabled=0
pipe=omd2mp-dev
; 1 = allow the raw memory `write` command (dangerous; for patch experiments only)
allow_write=0

[mpdebug]
; Mock players: test N-player co-op alone. When you host ("Create party"), party_size-1
; fake players connect, take session slots, ack and ready up like real clients. They have
; no hero and send no gameplay input. Host only. Watch them with `tools/devcon.py mock`
; (needs [dev] enabled=1). See docs/CONTRIBUTING.md section 13. Never enable for real play.
enabled=0
; total players including you, 2..players (2 also works with the slots group off)
party_size=4
; mock i connects i*join_delay_ms after you start hosting
join_delay_ms=1500
; a mock repeats its ack / ready if the host leaves its slot un-acked or not ready this long
settle_ms=750
; when mocks press "ready" in the lobby:
;   follow  = when you do (ready up and the game starts with everyone)
;   auto    = as soon as they join
;   manual  = only on `tools/devcon.py mock ready <i>`
ready=follow
; 1 = each mock copies your character/profile (0x8e), so it has a portrait instead of a blank
mirror_profile=1
