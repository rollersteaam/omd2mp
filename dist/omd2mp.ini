; omd2mp loader settings - copy next to OrcsMustDie2.exe together with version.dll
[omd2mp]
; 0 = load but patch nothing
enabled=1
; party size, 2..16. Every player in the session must use the same value.
players=4
; patch groups to apply (see patches/patchset.json):
;   lobby    Steam lobby size + host connection caps
;   mesh     client connection cap + FullyConnectedMesh2 auto-connect
;   slots    grow the Session player-slot array to `players`   (EXPERIMENTAL)
;   economy  NetMoneyFactor = 1/players (team gold stays equal to vanilla 2-player)
;   netfix   RakNet receive-drain fix for co-op disconnects (docs/DISCONNECT_FIX_PROPOSAL.md)
groups=lobby,mesh,slots,economy
